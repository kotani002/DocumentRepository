<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 550" width="900" height="550" font-family="'Meiryo','Hiragino Sans','Noto Sans JP',sans-serif">
  <defs>
    <marker id="m" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto"><path d="M0,1 L14,7 L0,13 z" fill="#37474f"/></marker>
    <marker id="g" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto"><path d="M0,1 L14,7 L0,13 z" fill="#90a4ae"/></marker>
  </defs>
  <rect width="900" height="550" fill="#ffffff"/>
  <text x="450" y="34" font-size="22" font-weight="bold" fill="#0d47a1" text-anchor="middle">Pull Request(PR)の流れ</text>
  <rect x="20" y="56" width="860" height="150" rx="14" fill="#ffffff" stroke="#2e7d32" stroke-width="4"/>
  <text x="38" y="84" font-size="17" font-weight="bold" fill="#1b5e20" text-anchor="start">Local(手元のPC)</text>
  <rect x="20" y="250" width="860" height="150" rx="14" fill="#ffffff" stroke="#6a1b9a" stroke-width="4"/>
  <text x="38" y="278" font-size="17" font-weight="bold" fill="#4a148c" text-anchor="start">Remote(GitHub)</text>
  <rect x="50" y="96" width="240" height="80" rx="12" fill="#ffd54f" stroke="#f9a825" stroke-width="3"/>
  <text x="170" y="129" font-size="19" font-weight="bold" fill="#212121" text-anchor="middle">① branch を作る</text>
  <text x="170" y="155" font-size="13" font-weight="bold" fill="#0d47a1" text-anchor="middle" font-family="Consolas,'Courier New',monospace">git switch -c feature</text>
  <rect x="340" y="96" width="240" height="80" rx="12" fill="#ffd54f" stroke="#f9a825" stroke-width="3"/>
  <text x="460" y="129" font-size="19" font-weight="bold" fill="#212121" text-anchor="middle">② 変更を commit</text>
  <text x="460" y="155" font-size="13" font-weight="bold" fill="#0d47a1" text-anchor="middle" font-family="Consolas,'Courier New',monospace">git add / git commit</text>
  <rect x="630" y="96" width="240" height="80" rx="12" fill="#ffd54f" stroke="#f9a825" stroke-width="3"/>
  <text x="750" y="129" font-size="19" font-weight="bold" fill="#212121" text-anchor="middle">③ branch を push</text>
  <text x="750" y="155" font-size="13" font-weight="bold" fill="#0d47a1" text-anchor="middle" font-family="Consolas,'Courier New',monospace">git push -u origin feature</text>
  <line x1="292" y1="136" x2="338" y2="136" stroke="#37474f" stroke-width="3" marker-end="url(#m)"/>
  <line x1="582" y1="136" x2="628" y2="136" stroke="#37474f" stroke-width="3" marker-end="url(#m)"/>
  <path d="M750,178 L750,228 L250,228 L250,286" fill="none" stroke="#37474f" stroke-width="3" marker-end="url(#m)"/>
  <rect x="50" y="290" width="240" height="80" rx="12" fill="#ffffff" stroke="#607d8b" stroke-width="3"/>
  <text x="170" y="323" font-size="19" font-weight="bold" fill="#212121" text-anchor="middle">④ PR を作成</text>
  <text x="170" y="349" font-size="15" font-weight="normal" fill="#37474f" text-anchor="middle">New pull request</text>
  <rect x="340" y="290" width="240" height="80" rx="12" fill="#ffffff" stroke="#607d8b" stroke-width="4"/>
  <text x="460" y="323" font-size="19" font-weight="bold" fill="#212121" text-anchor="middle">⑤ 差分を review</text>
  <text x="460" y="349" font-size="15" font-weight="normal" fill="#37474f" text-anchor="middle">不要ファイル・秘密情報の確認</text>
  <rect x="630" y="290" width="240" height="80" rx="12" fill="#64b5f6" stroke="#1565c0" stroke-width="3"/>
  <text x="750" y="323" font-size="19" font-weight="bold" fill="#212121" text-anchor="middle">⑥ main に merge</text>
  <text x="750" y="349" font-size="15" font-weight="normal" fill="#37474f" text-anchor="middle">Merge pull request</text>
  <line x1="292" y1="330" x2="338" y2="330" stroke="#37474f" stroke-width="3" marker-end="url(#m)"/>
  <line x1="582" y1="330" x2="628" y2="330" stroke="#37474f" stroke-width="3" marker-end="url(#m)"/>
  <rect x="375" y="412" width="170" height="28" rx="14" fill="#37474f" stroke="#37474f" stroke-width="2"/>
  <text x="460" y="431" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">ここで汚染を防ぐ</text>
  <rect x="10" y="458" width="880" height="78" rx="10" fill="#fafafa" stroke="#b0bec5" stroke-width="1.5"/>
  <text x="24" y="487" font-size="16" font-weight="bold" fill="#37474f" text-anchor="start">図の色の見方</text>
  <rect x="170" y="470" width="22" height="22" rx="4" fill="#ffd54f" stroke="#f9a825" stroke-width="2.5"/>
  <text x="200" y="487" font-size="15" font-weight="normal" fill="#212121" text-anchor="start">黄 = 作業中の branch</text>
  <rect x="400" y="470" width="22" height="22" rx="4" fill="#64b5f6" stroke="#1565c0" stroke-width="2.5"/>
  <text x="430" y="487" font-size="15" font-weight="normal" fill="#212121" text-anchor="start">青 = merge 先などの未来の branch</text>
  <rect x="700" y="470" width="22" height="22" rx="4" fill="#ffffff" stroke="#607d8b" stroke-width="2.5"/>
  <text x="730" y="487" font-size="15" font-weight="normal" fill="#212121" text-anchor="start">白 = それ以外</text>
  <rect x="170" y="502" width="22" height="22" rx="4" fill="#ffffff" stroke="#2e7d32" stroke-width="2.5"/>
  <text x="200" y="519" font-size="15" font-weight="normal" fill="#212121" text-anchor="start">緑の枠 = Local(手元のPC)</text>
  <rect x="400" y="502" width="22" height="22" rx="4" fill="#ffffff" stroke="#6a1b9a" stroke-width="2.5"/>
  <text x="430" y="519" font-size="15" font-weight="normal" fill="#212121" text-anchor="start">紫の枠 = Remote(GitHub)</text>
</svg>
