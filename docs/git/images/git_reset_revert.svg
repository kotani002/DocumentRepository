<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 546" width="900" height="546" font-family="'Meiryo','Hiragino Sans','Noto Sans JP',sans-serif">
  <defs>
    <marker id="m" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto"><path d="M0,1 L14,7 L0,13 z" fill="#37474f"/></marker>
    <marker id="g" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto"><path d="M0,1 L14,7 L0,13 z" fill="#90a4ae"/></marker>
  </defs>
  <rect width="900" height="546" fill="#ffffff"/>
  <rect x="10" y="10" width="880" height="258" rx="12" fill="#ffffff" stroke="#b0bec5" stroke-width="2"/>
  <text x="28" y="42" font-size="20" font-weight="bold" fill="#0d47a1" text-anchor="start">① git reset --hard B(履歴を巻き戻す)</text>
  <text x="28" y="124" font-size="16" font-weight="bold" fill="#455a64" text-anchor="start">実行前</text>
  <rect x="310" y="56" width="120" height="28" rx="14" fill="#ffd54f" stroke="#f9a825" stroke-width="2"/>
  <text x="370" y="75" font-size="15" font-weight="bold" fill="#212121" text-anchor="middle">作業 branch</text>
  <line x1="158" y1="118" x2="222" y2="118" stroke="#37474f" stroke-width="3" marker-end="url(#m)"/>
  <line x1="278" y1="118" x2="342" y2="118" stroke="#37474f" stroke-width="3" marker-end="url(#m)"/>
  <circle cx="130" cy="118" r="26" fill="#ffd54f" stroke="#f9a825" stroke-width="3"/>
  <text x="130" y="125" font-size="20" font-weight="bold" fill="#212121" text-anchor="middle">A</text>
  <circle cx="250" cy="118" r="26" fill="#ffd54f" stroke="#f9a825" stroke-width="3"/>
  <text x="250" y="125" font-size="20" font-weight="bold" fill="#212121" text-anchor="middle">B</text>
  <circle cx="370" cy="118" r="26" fill="#ffd54f" stroke="#f9a825" stroke-width="3"/>
  <text x="370" y="125" font-size="20" font-weight="bold" fill="#212121" text-anchor="middle">C</text>
  <text x="28" y="220" font-size="16" font-weight="bold" fill="#455a64" text-anchor="start">実行後</text>
  <rect x="190" y="152" width="120" height="28" rx="14" fill="#ffd54f" stroke="#f9a825" stroke-width="2"/>
  <text x="250" y="171" font-size="15" font-weight="bold" fill="#212121" text-anchor="middle">作業 branch</text>
  <line x1="158" y1="214" x2="222" y2="214" stroke="#37474f" stroke-width="3" marker-end="url(#m)"/>
  <line x1="278" y1="214" x2="342" y2="214" stroke="#90a4ae" stroke-width="2.5" stroke-dasharray="6,5" marker-end="url(#g)"/>
  <circle cx="130" cy="214" r="26" fill="#ffd54f" stroke="#f9a825" stroke-width="3"/>
  <text x="130" y="221" font-size="20" font-weight="bold" fill="#212121" text-anchor="middle">A</text>
  <circle cx="250" cy="214" r="26" fill="#ffd54f" stroke="#f9a825" stroke-width="3"/>
  <text x="250" y="221" font-size="20" font-weight="bold" fill="#212121" text-anchor="middle">B</text>
  <circle cx="370" cy="214" r="26" fill="#ffffff" stroke="#78909c" stroke-width="3" stroke-dasharray="6,5"/>
  <text x="370" y="221" font-size="20" font-weight="bold" fill="#78909c" text-anchor="middle">C</text>
  <rect x="430" y="196" width="420" height="36" rx="8" fill="#ffffff" stroke="#607d8b" stroke-width="2"/>
  <text x="444" y="220" font-size="15" font-weight="normal" fill="#212121" text-anchor="start">C は履歴から外れる(共有 branch では避ける)</text>
  <rect x="10" y="282" width="880" height="188" rx="12" fill="#ffffff" stroke="#b0bec5" stroke-width="2"/>
  <text x="28" y="314" font-size="20" font-weight="bold" fill="#0d47a1" text-anchor="start">② git revert C(打ち消しの commit を追加)</text>
  <rect x="430" y="328" width="120" height="28" rx="14" fill="#ffd54f" stroke="#f9a825" stroke-width="2"/>
  <text x="490" y="347" font-size="15" font-weight="bold" fill="#212121" text-anchor="middle">作業 branch</text>
  <line x1="158" y1="396" x2="222" y2="396" stroke="#37474f" stroke-width="3" marker-end="url(#m)"/>
  <line x1="278" y1="396" x2="342" y2="396" stroke="#37474f" stroke-width="3" marker-end="url(#m)"/>
  <line x1="398" y1="396" x2="462" y2="396" stroke="#37474f" stroke-width="3" marker-end="url(#m)"/>
  <circle cx="130" cy="396" r="26" fill="#ffd54f" stroke="#f9a825" stroke-width="3"/>
  <text x="130" y="403" font-size="20" font-weight="bold" fill="#212121" text-anchor="middle">A</text>
  <circle cx="250" cy="396" r="26" fill="#ffd54f" stroke="#f9a825" stroke-width="3"/>
  <text x="250" y="403" font-size="20" font-weight="bold" fill="#212121" text-anchor="middle">B</text>
  <circle cx="370" cy="396" r="26" fill="#ffd54f" stroke="#f9a825" stroke-width="3"/>
  <text x="370" y="403" font-size="20" font-weight="bold" fill="#212121" text-anchor="middle">C</text>
  <circle cx="490" cy="396" r="26" fill="#ffd54f" stroke="#f9a825" stroke-width="3"/>
  <text x="490" y="403" font-size="20" font-weight="bold" fill="#212121" text-anchor="middle">C'</text>
  <text x="534" y="402" font-size="17" font-weight="bold" fill="#0d47a1" text-anchor="start">← 新しく追加(C の変更を打ち消す)</text>
  <text x="28" y="452" font-size="16" font-weight="normal" fill="#37474f" text-anchor="start">履歴は消えないので、push 済みでも安全に取り消せます。</text>
  <rect x="10" y="486" width="880" height="46" rx="10" fill="#fafafa" stroke="#b0bec5" stroke-width="1.5"/>
  <text x="24" y="515" font-size="16" font-weight="bold" fill="#37474f" text-anchor="start">図の色の見方</text>
  <rect x="170" y="498" width="22" height="22" rx="4" fill="#ffd54f" stroke="#f9a825" stroke-width="2.5"/>
  <text x="200" y="515" font-size="15" font-weight="normal" fill="#212121" text-anchor="start">黄 = 作業中の branch</text>
  <rect x="400" y="498" width="22" height="22" rx="4" fill="#64b5f6" stroke="#1565c0" stroke-width="2.5"/>
  <text x="430" y="515" font-size="15" font-weight="normal" fill="#212121" text-anchor="start">青 = merge 先などの未来の branch</text>
  <rect x="700" y="498" width="22" height="22" rx="4" fill="#ffffff" stroke="#607d8b" stroke-width="2.5"/>
  <text x="730" y="515" font-size="15" font-weight="normal" fill="#212121" text-anchor="start">白 = それ以外</text>
</svg>
