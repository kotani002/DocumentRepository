  <text x="566" y="267" font-size="14" font-weight="bold" fill="#212121" text-anchor="middle" font-family="Consolas,'Courier New',monospace">a.txt</text>
  <rect x="608" y="246" width="68" height="32" rx="6" fill="#ffffff" stroke="#607d8b" stroke-width="2"/>
  <text x="642" y="267" font-size="14" font-weight="bold" fill="#212121" text-anchor="middle" font-family="Consolas,'Courier New',monospace">b.txt</text>
  <rect x="684" y="246" width="68" height="32" rx="6" fill="#ffffff" stroke="#90a4ae" stroke-width="2" stroke-dasharray="5,4"/>
