<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" font-family="'Meiryo','Hiragino Sans','Noto Sans JP',sans-serif">
  <defs>
    <marker id="m" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto"><path d="M0,1 L14,7 L0,13 z" fill="#37474f"/></marker>
    <marker id="g" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto"><path d="M0,1 L14,7 L0,13 z" fill="#90a4ae"/></marker>
  </defs>
  <rect width="900" height="400" fill="#ffffff"/>
  <text x="450" y="34" font-size="22" font-weight="bold" fill="#0d47a1" text-anchor="middle">conflict:同じ場所を別々に変えると起きる</text>
  <rect x="20" y="56" width="860" height="234" rx="14" fill="#ffffff" stroke="#2e7d32" stroke-width="4"/>
  <text x="38" y="84" font-size="17" font-weight="bold" fill="#1b5e20" text-anchor="start">Local(手元のPC)</text>
  <text x="40" y="112" font-size="16" font-weight="bold" fill="#37474f" text-anchor="start">① 元のファイル</text>
  <text x="330" y="112" font-size="16" font-weight="bold" fill="#37474f" text-anchor="start">② 別々に変更</text>
  <text x="650" y="112" font-size="16" font-weight="bold" fill="#37474f" text-anchor="start">③ merge すると</text>
  <rect x="40" y="124" width="210" height="100" rx="12" fill="#ffffff" stroke="#607d8b" stroke-width="3"/>
  <text x="54" y="150" font-size="13" font-weight="normal" fill="#455a64" text-anchor="start">index.html</text>
  <text x="54" y="190" font-size="18" font-weight="bold" fill="#212121" text-anchor="start" font-family="Consolas,'Courier New',monospace">title: 資料</text>
  <rect x="330" y="122" width="250" height="64" rx="12" fill="#64b5f6" stroke="#1565c0" stroke-width="3"/>
  <text x="344" y="146" font-size="13" font-weight="bold" fill="#212121" text-anchor="start">main で変更</text>
  <text x="344" y="172" font-size="18" font-weight="bold" fill="#212121" text-anchor="start" font-family="Consolas,'Courier New',monospace">title: Git入門</text>
  <rect x="330" y="204" width="250" height="64" rx="12" fill="#ffd54f" stroke="#f9a825" stroke-width="3"/>
  <text x="344" y="228" font-size="13" font-weight="bold" fill="#212121" text-anchor="start">feature で変更</text>
  <text x="344" y="254" font-size="18" font-weight="bold" fill="#212121" text-anchor="start" font-family="Consolas,'Courier New',monospace">title: 学習メモ</text>
  <line x1="252" y1="160" x2="326" y2="152" stroke="#37474f" stroke-width="3" marker-end="url(#m)"/>
  <line x1="252" y1="190" x2="326" y2="236" stroke="#37474f" stroke-width="3" marker-end="url(#m)"/>
  <rect x="650" y="124" width="210" height="144" rx="12" fill="#ffffff" stroke="#607d8b" stroke-width="3"/>
  <rect x="700" y="138" width="110" height="28" rx="14" fill="#37474f" stroke="#37474f" stroke-width="2"/>
  <text x="755" y="157" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">conflict</text>
  <text x="755" y="198" font-size="15" font-weight="normal" fill="#212121" text-anchor="middle">同じ行が別の内容に</text>
  <text x="755" y="222" font-size="15" font-weight="normal" fill="#212121" text-anchor="middle">なっているので、</text>
  <text x="755" y="246" font-size="15" font-weight="bold" fill="#212121" text-anchor="middle">Git が選べない</text>
  <line x1="582" y1="154" x2="646" y2="176" stroke="#37474f" stroke-width="3" marker-end="url(#m)"/>
  <line x1="582" y1="236" x2="646" y2="214" stroke="#37474f" stroke-width="3" marker-end="url(#m)"/>
  <rect x="10" y="308" width="880" height="78" rx="10" fill="#fafafa" stroke="#b0bec5" stroke-width="1.5"/>
  <text x="24" y="337" font-size="16" font-weight="bold" fill="#37474f" text-anchor="start">図の色の見方</text>
  <rect x="170" y="320" width="22" height="22" rx="4" fill="#ffd54f" stroke="#f9a825" stroke-width="2.5"/>
  <text x="200" y="337" font-size="15" font-weight="normal" fill="#212121" text-anchor="start">黄 = 作業中の branch</text>
  <rect x="400" y="320" width="22" height="22" rx="4" fill="#64b5f6" stroke="#1565c0" stroke-width="2.5"/>
  <text x="430" y="337" font-size="15" font-weight="normal" fill="#212121" text-anchor="start">青 = merge 先などの未来の branch</text>
  <rect x="700" y="320" width="22" height="22" rx="4" fill="#ffffff" stroke="#607d8b" stroke-width="2.5"/>
  <text x="730" y="337" font-size="15" font-weight="normal" fill="#212121" text-anchor="start">白 = それ以外</text>
  <rect x="170" y="352" width="22" height="22" rx="4" fill="#ffffff" stroke="#2e7d32" stroke-width="2.5"/>
  <text x="200" y="369" font-size="15" font-weight="normal" fill="#212121" text-anchor="start">緑の枠 = Local(手元のPC)</text>
  <rect x="400" y="352" width="22" height="22" rx="4" fill="#ffffff" stroke="#6a1b9a" stroke-width="2.5"/>
  <text x="430" y="369" font-size="15" font-weight="normal" fill="#212121" text-anchor="start">紫の枠 = Remote(GitHub)</text>
</svg>
