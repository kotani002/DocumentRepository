<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 260" width="780" height="260" font-family="'Meiryo','Hiragino Sans','Noto Sans JP',sans-serif">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1565c0"/>
    </marker>
    <marker id="y" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#f9a825"/>
    </marker>
  </defs>
  <rect width="780" height="260" fill="#ffffff"/>
  <text x="390" y="26" text-anchor="middle" font-size="18" font-weight="bold" fill="#0d47a1">ブランチを切って、マージして戻す流れ</text>

  <!-- main line (blue) -->
  <line x1="102" y1="100" x2="178" y2="100" stroke="#1565c0" stroke-width="3" marker-end="url(#a)"/>
  <line x1="222" y1="100" x2="308" y2="100" stroke="#1565c0" stroke-width="3" marker-end="url(#a)"/>
  <line x1="352" y1="100" x2="548" y2="100" stroke="#1565c0" stroke-width="3" marker-end="url(#a)"/>
  <!-- feature line (yellow) -->
  <line x1="214" y1="118" x2="282" y2="168" stroke="#f9a825" stroke-width="3" marker-end="url(#y)"/>
  <line x1="332" y1="180" x2="408" y2="180" stroke="#f9a825" stroke-width="3" marker-end="url(#y)"/>
  <line x1="452" y1="170" x2="556" y2="118" stroke="#f9a825" stroke-width="3" marker-end="url(#y)"/>

  <circle cx="80" cy="100" r="22" fill="#e3f2fd" stroke="#1565c0" stroke-width="3"/>
  <text x="80" y="106" text-anchor="middle" font-size="16" font-weight="bold" fill="#0d47a1">A</text>
  <circle cx="200" cy="100" r="22" fill="#e3f2fd" stroke="#1565c0" stroke-width="3"/>
  <text x="200" y="106" text-anchor="middle" font-size="16" font-weight="bold" fill="#0d47a1">B</text>
  <circle cx="330" cy="100" r="22" fill="#e3f2fd" stroke="#1565c0" stroke-width="3"/>
  <text x="330" y="106" text-anchor="middle" font-size="16" font-weight="bold" fill="#0d47a1">C</text>
  <circle cx="570" cy="100" r="22" fill="#1e88e5" stroke="#0d47a1" stroke-width="3"/>
  <text x="570" y="106" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">M</text>

  <circle cx="310" cy="180" r="22" fill="#fff3b0" stroke="#f9a825" stroke-width="3"/>
  <text x="310" y="186" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">D</text>
  <circle cx="430" cy="180" r="22" fill="#fff3b0" stroke="#f9a825" stroke-width="3"/>
  <text x="430" y="186" text-anchor="middle" font-size="16" font-weight="bold" fill="#333">E</text>

  <!-- tags -->
  <rect x="542" y="50" width="56" height="22" rx="11" fill="#1565c0"/>
  <text x="570" y="66" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">main</text>
  <rect x="402" y="214" width="56" height="22" rx="11" fill="#f9a825"/>
  <text x="430" y="230" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">feature</text>
  <rect x="610" y="50" width="56" height="22" rx="11" fill="#0d47a1"/>
  <text x="638" y="66" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">HEAD</text>
  <line x1="610" y1="61" x2="600" y2="61" stroke="#0d47a1" stroke-width="2" marker-end="url(#a)"/>

  <!-- notes -->
  <rect x="30" y="152" width="170" height="44" rx="8" fill="#fff8e1" stroke="#f9a825" stroke-width="1.5"/>
  <text x="40" y="170" font-size="12" fill="#333">① B から feature を作成</text>
  <text x="40" y="188" font-size="12" font-weight="bold" font-family="Consolas,monospace" fill="#0d47a1">git switch -c feature</text>
  <rect x="590" y="152" width="170" height="44" rx="8" fill="#e3f2fd" stroke="#1e88e5" stroke-width="1.5"/>
  <text x="600" y="170" font-size="12" fill="#333">② feature を main に統合</text>
  <text x="600" y="188" font-size="12" font-weight="bold" font-family="Consolas,monospace" fill="#0d47a1">git merge feature</text>
  <text x="390" y="252" text-anchor="middle" font-size="12" fill="#37474f">青 = main(安定版)、黄 = 作業ブランチ、丸 = コミット</text>
</svg>
