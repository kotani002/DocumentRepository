<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" width="900" height="450" font-family="'Meiryo','Hiragino Sans','Noto Sans JP',sans-serif">
  <defs>
    <marker id="m" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto"><path d="M0,1 L14,7 L0,13 z" fill="#37474f"/></marker>
    <marker id="g" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto"><path d="M0,1 L14,7 L0,13 z" fill="#90a4ae"/></marker>
  </defs>
  <rect width="900" height="450" fill="#ffffff"/>
  <text x="450" y="34" font-size="22" font-weight="bold" fill="#0d47a1" text-anchor="middle">branch を切って、merge して戻す流れ</text>
  <line x1="158" y1="130" x2="202" y2="130" stroke="#37474f" stroke-width="3" marker-end="url(#m)"/>
  <line x1="258" y1="130" x2="342" y2="130" stroke="#37474f" stroke-width="3" marker-end="url(#m)"/>
  <line x1="398" y1="130" x2="694" y2="130" stroke="#37474f" stroke-width="3" marker-end="url(#m)"/>
  <line x1="251" y1="145" x2="347" y2="214" stroke="#37474f" stroke-width="3" marker-end="url(#m)"/>
  <line x1="398" y1="230" x2="522" y2="230" stroke="#37474f" stroke-width="3" marker-end="url(#m)"/>
  <line x1="572" y1="217" x2="696" y2="144" stroke="#37474f" stroke-width="3" marker-end="url(#m)"/>
  <circle cx="130" cy="130" r="26" fill="#64b5f6" stroke="#1565c0" stroke-width="3"/>
  <text x="130" y="137" font-size="20" font-weight="bold" fill="#212121" text-anchor="middle">A</text>
  <circle cx="230" cy="130" r="26" fill="#64b5f6" stroke="#1565c0" stroke-width="3"/>
  <text x="230" y="137" font-size="20" font-weight="bold" fill="#212121" text-anchor="middle">B</text>
  <circle cx="370" cy="130" r="26" fill="#64b5f6" stroke="#1565c0" stroke-width="3"/>
  <text x="370" y="137" font-size="20" font-weight="bold" fill="#212121" text-anchor="middle">C</text>
  <circle cx="720" cy="130" r="26" fill="#64b5f6" stroke="#1565c0" stroke-width="3"/>
  <text x="720" y="137" font-size="20" font-weight="bold" fill="#212121" text-anchor="middle">M</text>
  <circle cx="370" cy="230" r="26" fill="#ffd54f" stroke="#f9a825" stroke-width="3"/>
  <text x="370" y="237" font-size="20" font-weight="bold" fill="#212121" text-anchor="middle">D</text>
  <circle cx="550" cy="230" r="26" fill="#ffd54f" stroke="#f9a825" stroke-width="3"/>
  <text x="550" y="237" font-size="20" font-weight="bold" fill="#212121" text-anchor="middle">E</text>
  <rect x="688" y="62" width="64" height="28" rx="14" fill="#64b5f6" stroke="#1565c0" stroke-width="2"/>
  <text x="720" y="81" font-size="15" font-weight="bold" fill="#212121" text-anchor="middle">main</text>
  <rect x="789" y="62" width="70" height="28" rx="14" fill="#ffffff" stroke="#607d8b" stroke-width="2"/>
  <text x="824" y="81" font-size="15" font-weight="bold" fill="#212121" text-anchor="middle">HEAD</text>
  <line x1="788" y1="76" x2="756" y2="76" stroke="#37474f" stroke-width="3" marker-end="url(#m)"/>
  <rect x="500" y="264" width="100" height="28" rx="14" fill="#ffd54f" stroke="#f9a825" stroke-width="2"/>
  <text x="550" y="283" font-size="15" font-weight="bold" fill="#212121" text-anchor="middle">feature</text>
  <rect x="30" y="304" width="330" height="70" rx="12" fill="#ffffff" stroke="#607d8b" stroke-width="3"/>
  <text x="46" y="330" font-size="17" font-weight="bold" fill="#212121" text-anchor="start">① B から feature を作成</text>
  <text x="46" y="358" font-size="16" font-weight="bold" fill="#0d47a1" text-anchor="start" font-family="Consolas,'Courier New',monospace">git switch -c feature</text>
  <rect x="500" y="304" width="370" height="70" rx="12" fill="#ffffff" stroke="#607d8b" stroke-width="3"/>
  <text x="516" y="330" font-size="17" font-weight="bold" fill="#212121" text-anchor="start">② feature を main に merge</text>
  <text x="516" y="358" font-size="16" font-weight="bold" fill="#0d47a1" text-anchor="start" font-family="Consolas,'Courier New',monospace">git switch main → git merge feature</text>
  <rect x="10" y="392" width="880" height="46" rx="10" fill="#fafafa" stroke="#b0bec5" stroke-width="1.5"/>
  <text x="24" y="421" font-size="16" font-weight="bold" fill="#37474f" text-anchor="start">図の色の見方</text>
  <rect x="170" y="404" width="22" height="22" rx="4" fill="#ffd54f" stroke="#f9a825" stroke-width="2.5"/>
  <text x="200" y="421" font-size="15" font-weight="normal" fill="#212121" text-anchor="start">黄 = 作業中の branch</text>
  <rect x="400" y="404" width="22" height="22" rx="4" fill="#64b5f6" stroke="#1565c0" stroke-width="2.5"/>
  <text x="430" y="421" font-size="15" font-weight="normal" fill="#212121" text-anchor="start">青 = merge 先などの未来の branch</text>
  <rect x="700" y="404" width="22" height="22" rx="4" fill="#ffffff" stroke="#607d8b" stroke-width="2.5"/>
  <text x="730" y="421" font-size="15" font-weight="normal" fill="#212121" text-anchor="start">白 = それ以外</text>
</svg>
