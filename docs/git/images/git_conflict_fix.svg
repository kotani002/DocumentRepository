<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 490" width="900" height="490" font-family="'Meiryo','Hiragino Sans','Noto Sans JP',sans-serif">
  <defs>
    <marker id="m" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto"><path d="M0,1 L14,7 L0,13 z" fill="#37474f"/></marker>
    <marker id="g" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto"><path d="M0,1 L14,7 L0,13 z" fill="#90a4ae"/></marker>
  </defs>
  <rect width="900" height="490" fill="#ffffff"/>
  <text x="450" y="34" font-size="22" font-weight="bold" fill="#0d47a1" text-anchor="middle">conflict の解消:発生を示す行を消して、残す内容を決める</text>
  <rect x="20" y="56" width="860" height="240" rx="14" fill="#ffffff" stroke="#2e7d32" stroke-width="4"/>
  <text x="38" y="84" font-size="17" font-weight="bold" fill="#1b5e20" text-anchor="start">Local(手元のPC)</text>
  <text x="40" y="112" font-size="16" font-weight="bold" fill="#37474f" text-anchor="start">conflict 中のファイル</text>
  <text x="660" y="112" font-size="16" font-weight="bold" fill="#37474f" text-anchor="start">解消後のファイル</text>
  <rect x="40" y="122" width="360" height="156" rx="8" fill="#ffffff" stroke="#607d8b" stroke-width="2"/>
  <rect x="46" y="126" width="348" height="28" rx="4" fill="#eceff1"/>
  <text x="58" y="146" font-size="15" font-weight="bold" fill="#212121" text-anchor="start" font-family="Consolas,'Courier New',monospace">&lt;&lt;&lt;&lt;&lt;&lt;&lt; HEAD</text>
  <rect x="46" y="156" width="348" height="28" rx="4" fill="#64b5f6"/>
  <text x="58" y="176" font-size="15" font-weight="bold" fill="#212121" text-anchor="start" font-family="Consolas,'Courier New',monospace">title: Git入門</text>
  <rect x="46" y="186" width="348" height="28" rx="4" fill="#eceff1"/>
  <text x="58" y="206" font-size="15" font-weight="bold" fill="#212121" text-anchor="start" font-family="Consolas,'Courier New',monospace">=======</text>
  <rect x="46" y="216" width="348" height="28" rx="4" fill="#ffd54f"/>
  <text x="58" y="236" font-size="15" font-weight="bold" fill="#212121" text-anchor="start" font-family="Consolas,'Courier New',monospace">title: 学習メモ</text>
  <rect x="46" y="246" width="348" height="28" rx="4" fill="#eceff1"/>
  <text x="58" y="266" font-size="15" font-weight="bold" fill="#212121" text-anchor="start" font-family="Consolas,'Courier New',monospace">&gt;&gt;&gt;&gt;&gt;&gt;&gt; feature</text>
  <text x="412" y="175" font-size="13" font-weight="bold" fill="#0d47a1" text-anchor="start">← main の内容</text>
  <text x="412" y="235" font-size="13" font-weight="bold" fill="#8a5a00" text-anchor="start">← feature の内容</text>
  <rect x="558" y="150" width="84" height="28" rx="14" fill="#ffffff" stroke="#607d8b" stroke-width="2"/>
  <text x="600" y="169" font-size="15" font-weight="bold" fill="#212121" text-anchor="middle">書き直す</text>
  <line x1="560" y1="200" x2="650" y2="200" stroke="#37474f" stroke-width="3" marker-end="url(#m)"/>
  <rect x="660" y="170" width="200" height="60" rx="12" fill="#ffffff" stroke="#607d8b" stroke-width="3"/>
  <text x="676" y="207" font-size="15" font-weight="bold" fill="#212121" text-anchor="start" font-family="Consolas,'Courier New',monospace">title: Git入門メモ</text>
  <text x="760" y="254" font-size="13" font-weight="normal" fill="#455a64" text-anchor="middle">&lt;&lt;&lt;  ===  &gt;&gt;&gt; の行はなくなる</text>
  <rect x="22" y="316" width="196" height="64" rx="12" fill="#ffffff" stroke="#607d8b" stroke-width="3"/>
  <text x="120" y="343" font-size="17" font-weight="bold" fill="#212121" text-anchor="middle">① ファイルを開く</text>
  <text x="120" y="365" font-size="13" font-weight="normal" fill="#455a64" text-anchor="middle">conflict の発生を示す行がある</text>
  <line x1="220" y1="348" x2="245" y2="348" stroke="#37474f" stroke-width="3" marker-end="url(#m)"/>
  <rect x="247" y="316" width="196" height="64" rx="12" fill="#ffffff" stroke="#607d8b" stroke-width="3"/>
  <text x="345" y="343" font-size="17" font-weight="bold" fill="#212121" text-anchor="middle">② 残す内容を決める</text>
  <text x="345" y="365" font-size="13" font-weight="normal" fill="#455a64" text-anchor="middle">main・feature・両方</text>
  <line x1="445" y1="348" x2="470" y2="348" stroke="#37474f" stroke-width="3" marker-end="url(#m)"/>
  <rect x="472" y="316" width="196" height="64" rx="12" fill="#ffffff" stroke="#607d8b" stroke-width="3"/>
  <text x="570" y="343" font-size="17" font-weight="bold" fill="#212121" text-anchor="middle">③ 発生を示す行を消す</text>
  <text x="570" y="365" font-size="13" font-weight="normal" fill="#455a64" text-anchor="middle">&lt;&lt;&lt;  ===  &gt;&gt;&gt; の行</text>
  <line x1="670" y1="348" x2="695" y2="348" stroke="#37474f" stroke-width="3" marker-end="url(#m)"/>
  <rect x="697" y="316" width="196" height="64" rx="12" fill="#ffffff" stroke="#607d8b" stroke-width="3"/>
  <text x="795" y="343" font-size="17" font-weight="bold" fill="#212121" text-anchor="middle">④ 保存して commit</text>
  <text x="795" y="365" font-size="13" font-weight="normal" fill="#455a64" text-anchor="middle">stage → commit</text>
  <rect x="10" y="398" width="880" height="78" rx="10" fill="#fafafa" stroke="#b0bec5" stroke-width="1.5"/>
  <text x="24" y="427" font-size="16" font-weight="bold" fill="#37474f" text-anchor="start">図の色の見方</text>
  <rect x="170" y="410" width="22" height="22" rx="4" fill="#ffd54f" stroke="#f9a825" stroke-width="2.5"/>
  <text x="200" y="427" font-size="15" font-weight="normal" fill="#212121" text-anchor="start">黄 = 作業中の branch</text>
  <rect x="400" y="410" width="22" height="22" rx="4" fill="#64b5f6" stroke="#1565c0" stroke-width="2.5"/>
  <text x="430" y="427" font-size="15" font-weight="normal" fill="#212121" text-anchor="start">青 = merge 先などの未来の branch</text>
  <rect x="700" y="410" width="22" height="22" rx="4" fill="#ffffff" stroke="#607d8b" stroke-width="2.5"/>
  <text x="730" y="427" font-size="15" font-weight="normal" fill="#212121" text-anchor="start">白 = それ以外</text>
  <rect x="170" y="442" width="22" height="22" rx="4" fill="#ffffff" stroke="#2e7d32" stroke-width="2.5"/>
  <text x="200" y="459" font-size="15" font-weight="normal" fill="#212121" text-anchor="start">緑の枠 = Local(手元のPC)</text>
  <rect x="400" y="442" width="22" height="22" rx="4" fill="#ffffff" stroke="#6a1b9a" stroke-width="2.5"/>
  <text x="430" y="459" font-size="15" font-weight="normal" fill="#212121" text-anchor="start">紫の枠 = Remote(GitHub)</text>
</svg>
