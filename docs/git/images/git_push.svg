  <text x="450" y="255" font-size="15" font-weight="bold" fill="#212121" text-anchor="middle" font-family="Consolas,'Courier New',monospace">git push</text>
  <text x="524" y="255" font-size="15" font-weight="bold" fill="#37474f" text-anchor="start">手元の commit D を remote へ送る</text>
  <text x="20" y="288" font-size="18" font-weight="bold" fill="#0d47a1" text-anchor="start">② push 後</text>
