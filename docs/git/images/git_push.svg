  <text x="38" y="200" font-size="14" font-weight="normal" fill="#455a64" text-anchor="start">D は手元にだけある commit</text>
  <text x="488" y="200" font-size="14" font-weight="normal" fill="#78909c" text-anchor="start">D はまだ届いていない</text>
  <line x1="450" y1="216" x2="450" y2="292" stroke="#37474f" stroke-width="3" marker-end="url(#m)"/>
