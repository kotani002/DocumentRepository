  <circle cx="160" cy="374" r="24" fill="#ffd54f" stroke="#f9a825" stroke-width="3"/>
  <text x="160" y="381" font-size="20" font-weight="bold" fill="#212121" text-anchor="middle">B</text>
  <circle cx="250" cy="374" r="24" fill="#ffd54f" stroke="#f9a825" stroke-width="3"/>
  <text x="250" y="381" font-size="20" font-weight="bold" fill="#212121" text-anchor="middle">C</text>
  <circle cx="340" cy="374" r="24" fill="#ffd54f" stroke="#f9a825" stroke-width="3"/>
  <text x="340" y="381" font-size="20" font-weight="bold" fill="#212121" text-anchor="middle">D</text>
  <line x1="548" y1="374" x2="582" y2="374" stroke="#37474f" stroke-width="3" marker-end="url(#m)"/>
  <line x1="638" y1="374" x2="672" y2="374" stroke="#37474f" stroke-width="3" marker-end="url(#m)"/>
  <line x1="728" y1="374" x2="762" y2="374" stroke="#37474f" stroke-width="3" marker-end="url(#m)"/>
  <circle cx="520" cy="374" r="24" fill="#ffd54f" stroke="#f9a825" stroke-width="3"/>
  <text x="520" y="381" font-size="20" font-weight="bold" fill="#212121" text-anchor="middle">A</text>
  <circle cx="610" cy="374" r="24" fill="#ffd54f" stroke="#f9a825" stroke-width="3"/>
  <text x="610" y="381" font-size="20" font-weight="bold" fill="#212121" text-anchor="middle">B</text>
  <circle cx="700" cy="374" r="24" fill="#ffd54f" stroke="#f9a825" stroke-width="3"/>
  <text x="700" y="381" font-size="20" font-weight="bold" fill="#212121" text-anchor="middle">C</text>
  <circle cx="790" cy="374" r="24" fill="#ffd54f" stroke="#f9a825" stroke-width="3"/>
  <text x="790" y="381" font-size="20" font-weight="bold" fill="#212121" text-anchor="middle">D</text>
  <text x="488" y="420" font-size="14" font-weight="bold" fill="#0d47a1" text-anchor="start">D が届いて、手元と同じ履歴になった</text>
  <rect x="10" y="448" width="880" height="78" rx="10" fill="#fafafa" stroke="#b0bec5" stroke-width="1.5"/>
  <text x="24" y="477" font-size="16" font-weight="bold" fill="#37474f" text-anchor="start">図の色の見方</text>
  <rect x="170" y="460" width="22" height="22" rx="4" fill="#ffd54f" stroke="#f9a825" stroke-width="2.5"/>
