<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 510" width="900" height="510" font-family="'Meiryo','Hiragino Sans','Noto Sans JP',sans-serif">
  <defs>
    <marker id="m" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto"><path d="M0,1 L14,7 L0,13 z" fill="#37474f"/></marker>
    <marker id="g" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto"><path d="M0,1 L14,7 L0,13 z" fill="#90a4ae"/></marker>
  </defs>
  <rect width="900" height="510" fill="#ffffff"/>
  <text x="450" y="34" font-size="22" font-weight="bold" fill="#0d47a1" text-anchor="middle">fetch と pull の違い:remote の更新を、どこまで取り込むか</text>
  <rect x="20" y="56" width="860" height="100" rx="14" fill="#ffffff" stroke="#6a1b9a" stroke-width="4"/>
  <text x="38" y="84" font-size="17" font-weight="bold" fill="#4a148c" text-anchor="start">Remote(GitHub)</text>
  <text x="40" y="118" font-size="15" font-weight="bold" fill="#4a148c" text-anchor="start">main</text>
  <line x1="155" y1="112" x2="184" y2="112" stroke="#37474f" stroke-width="3" marker-end="url(#m)"/>
  <line x1="240" y1="112" x2="269" y2="112" stroke="#37474f" stroke-width="3" marker-end="url(#m)"/>
  <line x1="325" y1="112" x2="354" y2="112" stroke="#37474f" stroke-width="3" marker-end="url(#m)"/>
  <circle cx="130" cy="112" r="24" fill="#ffffff" stroke="#607d8b" stroke-width="3"/>
  <text x="130" y="119" font-size="20" font-weight="bold" fill="#212121" text-anchor="middle">A</text>
  <circle cx="212" cy="112" r="24" fill="#ffffff" stroke="#607d8b" stroke-width="3"/>
  <text x="212" y="119" font-size="20" font-weight="bold" fill="#212121" text-anchor="middle">B</text>
  <circle cx="297" cy="112" r="24" fill="#ffffff" stroke="#607d8b" stroke-width="3"/>
  <text x="297" y="119" font-size="20" font-weight="bold" fill="#212121" text-anchor="middle">C</text>
  <circle cx="382" cy="112" r="24" fill="#ffffff" stroke="#607d8b" stroke-width="3"/>
  <text x="382" y="119" font-size="20" font-weight="bold" fill="#212121" text-anchor="middle">D</text>
  <text x="430" y="118" font-size="14" font-weight="bold" fill="#37474f" text-anchor="start">← D は、他の人が push した新しい commit</text>
  <rect x="20" y="200" width="860" height="200" rx="14" fill="#ffffff" stroke="#2e7d32" stroke-width="4"/>
  <text x="38" y="228" font-size="17" font-weight="bold" fill="#1b5e20" text-anchor="start">Local(手元のPC)</text>
  <line x1="250" y1="158" x2="250" y2="262" stroke="#37474f" stroke-width="3" marker-end="url(#m)"/>
  <line x1="670" y1="158" x2="670" y2="262" stroke="#37474f" stroke-width="3" marker-end="url(#m)"/>
  <rect x="185" y="164" width="130" height="28" rx="14" fill="#ffffff" stroke="#607d8b" stroke-width="2"/>
  <text x="250" y="183" font-size="15" font-weight="bold" fill="#212121" text-anchor="middle" font-family="Consolas,'Courier New',monospace">git fetch</text>
  <rect x="605" y="164" width="130" height="28" rx="14" fill="#ffffff" stroke="#607d8b" stroke-width="2"/>
  <text x="670" y="183" font-size="15" font-weight="bold" fill="#212121" text-anchor="middle" font-family="Consolas,'Courier New',monospace">git pull</text>
  <text x="40" y="256" font-size="1" font-weight="normal" fill="#212121" text-anchor="start"></text>
  <rect x="40" y="266" width="380" height="50" rx="12" fill="#ffffff" stroke="#607d8b" stroke-width="3"/>
  <text x="230" y="297" font-size="16" font-weight="bold" fill="#212121" text-anchor="middle">origin/main:D まで更新</text>
  <rect x="40" y="330" width="380" height="50" rx="12" fill="#ffd54f" stroke="#f9a825" stroke-width="3"/>
  <text x="230" y="361" font-size="16" font-weight="bold" fill="#212121" text-anchor="middle">main(作業中):C のまま</text>
  <rect x="480" y="266" width="380" height="50" rx="12" fill="#ffffff" stroke="#607d8b" stroke-width="3"/>
  <text x="670" y="297" font-size="16" font-weight="bold" fill="#212121" text-anchor="middle">origin/main:D まで更新</text>
  <rect x="480" y="330" width="380" height="50" rx="12" fill="#ffd54f" stroke="#f9a825" stroke-width="3"/>
  <text x="670" y="361" font-size="16" font-weight="bold" fill="#212121" text-anchor="middle">main(作業中):D まで進む</text>
  <text x="450" y="297" font-size="1" font-weight="normal" fill="#212121" text-anchor="start"></text>
  <rect x="10" y="414" width="880" height="78" rx="10" fill="#fafafa" stroke="#b0bec5" stroke-width="1.5"/>
  <text x="24" y="443" font-size="16" font-weight="bold" fill="#37474f" text-anchor="start">図の色の見方</text>
  <rect x="170" y="426" width="22" height="22" rx="4" fill="#ffd54f" stroke="#f9a825" stroke-width="2.5"/>
  <text x="200" y="443" font-size="15" font-weight="normal" fill="#212121" text-anchor="start">黄 = 作業中の branch</text>
  <rect x="400" y="426" width="22" height="22" rx="4" fill="#64b5f6" stroke="#1565c0" stroke-width="2.5"/>
  <text x="430" y="443" font-size="15" font-weight="normal" fill="#212121" text-anchor="start">青 = merge 先などの未来の branch</text>
  <rect x="700" y="426" width="22" height="22" rx="4" fill="#ffffff" stroke="#607d8b" stroke-width="2.5"/>
  <text x="730" y="443" font-size="15" font-weight="normal" fill="#212121" text-anchor="start">白 = それ以外</text>
  <rect x="170" y="458" width="22" height="22" rx="4" fill="#ffffff" stroke="#2e7d32" stroke-width="2.5"/>
  <text x="200" y="475" font-size="15" font-weight="normal" fill="#212121" text-anchor="start">緑の枠 = Local(手元のPC)</text>
  <rect x="400" y="458" width="22" height="22" rx="4" fill="#ffffff" stroke="#6a1b9a" stroke-width="2.5"/>
  <text x="430" y="475" font-size="15" font-weight="normal" fill="#212121" text-anchor="start">紫の枠 = Remote(GitHub)</text>
</svg>
