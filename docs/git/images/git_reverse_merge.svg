<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" font-family="'Meiryo','Hiragino Sans','Noto Sans JP',sans-serif">
  <defs>
    <marker id="m" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto"><path d="M0,1 L14,7 L0,13 z" fill="#37474f"/></marker>
    <marker id="g" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto"><path d="M0,1 L14,7 L0,13 z" fill="#90a4ae"/></marker>
  </defs>
  <rect width="900" height="400" fill="#ffffff"/>
  <text x="450" y="34" font-size="22" font-weight="bold" fill="#0d47a1" text-anchor="middle">逆 merge:main の最新を、作業中の feature に取り込む</text>
  <rect x="20" y="56" width="860" height="234" rx="14" fill="#ffffff" stroke="#2e7d32" stroke-width="4"/>
  <text x="38" y="84" font-size="17" font-weight="bold" fill="#1b5e20" text-anchor="start">Local(手元のPC)</text>
  <text x="60" y="112" font-size="17" font-weight="bold" fill="#37474f" text-anchor="start">操作前</text>
  <text x="520" y="112" font-size="17" font-weight="bold" fill="#37474f" text-anchor="start">操作後</text>
  <line x1="113" y1="150" x2="142" y2="150" stroke="#37474f" stroke-width="3" marker-end="url(#m)"/>
  <line x1="198" y1="150" x2="227" y2="150" stroke="#37474f" stroke-width="3" marker-end="url(#m)"/>
  <line x1="170" y1="174" x2="227" y2="214" stroke="#37474f" stroke-width="3" marker-end="url(#m)"/>
  <circle cx="85" cy="150" r="24" fill="#ffffff" stroke="#607d8b" stroke-width="3"/>
  <text x="85" y="157" font-size="20" font-weight="bold" fill="#212121" text-anchor="middle">A</text>
  <circle cx="170" cy="150" r="24" fill="#ffffff" stroke="#607d8b" stroke-width="3"/>
  <text x="170" y="157" font-size="20" font-weight="bold" fill="#212121" text-anchor="middle">B</text>
  <circle cx="255" cy="150" r="24" fill="#ffffff" stroke="#607d8b" stroke-width="3"/>
  <text x="255" y="157" font-size="20" font-weight="bold" fill="#212121" text-anchor="middle">D</text>
  <circle cx="255" cy="220" r="24" fill="#ffd54f" stroke="#f9a825" stroke-width="3"/>
  <text x="255" y="227" font-size="20" font-weight="bold" fill="#212121" text-anchor="middle">C</text>
  <text x="300" y="156" font-size="15" font-weight="bold" fill="#37474f" text-anchor="start">main</text>
  <text x="290" y="226" font-size="15" font-weight="bold" fill="#8a5a00" text-anchor="start">feature</text>
  <line x1="573" y1="150" x2="602" y2="150" stroke="#37474f" stroke-width="3" marker-end="url(#m)"/>
  <line x1="658" y1="150" x2="687" y2="150" stroke="#37474f" stroke-width="3" marker-end="url(#m)"/>
  <line x1="630" y1="174" x2="687" y2="214" stroke="#37474f" stroke-width="3" marker-end="url(#m)"/>
  <circle cx="545" cy="150" r="24" fill="#ffffff" stroke="#607d8b" stroke-width="3"/>
  <text x="545" y="157" font-size="20" font-weight="bold" fill="#212121" text-anchor="middle">A</text>
  <circle cx="630" cy="150" r="24" fill="#ffffff" stroke="#607d8b" stroke-width="3"/>
  <text x="630" y="157" font-size="20" font-weight="bold" fill="#212121" text-anchor="middle">B</text>
  <circle cx="715" cy="150" r="24" fill="#ffffff" stroke="#607d8b" stroke-width="3"/>
  <text x="715" y="157" font-size="20" font-weight="bold" fill="#212121" text-anchor="middle">D</text>
  <circle cx="715" cy="220" r="24" fill="#ffd54f" stroke="#f9a825" stroke-width="3"/>
  <text x="715" y="227" font-size="20" font-weight="bold" fill="#212121" text-anchor="middle">C</text>
  <circle cx="800" cy="220" r="24" fill="#ffd54f" stroke="#f9a825" stroke-width="3"/>
  <text x="800" y="227" font-size="20" font-weight="bold" fill="#212121" text-anchor="middle">M</text>
  <line x1="739" y1="150" x2="783" y2="202" stroke="#37474f" stroke-width="3" marker-end="url(#m)"/>
  <line x1="739" y1="220" x2="773" y2="220" stroke="#37474f" stroke-width="3" marker-end="url(#m)"/>
  <text x="752" y="132" font-size="15" font-weight="bold" fill="#37474f" text-anchor="start">main</text>
  <text x="840" y="262" font-size="15" font-weight="bold" fill="#8a5a00" text-anchor="end">feature</text>
  <rect x="380" y="118" width="140" height="28" rx="14" fill="#ffffff" stroke="#607d8b" stroke-width="2"/>
  <text x="450" y="137" font-size="15" font-weight="bold" fill="#212121" text-anchor="middle" font-family="Consolas,'Courier New',monospace">merge(main を取り込む)</text>
  <line x1="380" y1="170" x2="496" y2="170" stroke="#37474f" stroke-width="3" marker-end="url(#m)"/>
  <text x="450" y="198" font-size="13" font-weight="bold" fill="#37474f" text-anchor="middle">feature の上で実行</text>
  <text x="450" y="222" font-size="13" font-weight="bold" fill="#37474f" text-anchor="middle">main は変わらない</text>
  <text x="60" y="280" font-size="13" font-weight="normal" fill="#455a64" text-anchor="start">※ M は、2つの流れをつなぐ merge commit です</text>
  <rect x="10" y="308" width="880" height="78" rx="10" fill="#fafafa" stroke="#b0bec5" stroke-width="1.5"/>
  <text x="24" y="337" font-size="16" font-weight="bold" fill="#37474f" text-anchor="start">図の色の見方</text>
  <rect x="170" y="320" width="22" height="22" rx="4" fill="#ffd54f" stroke="#f9a825" stroke-width="2.5"/>
  <text x="200" y="337" font-size="15" font-weight="normal" fill="#212121" text-anchor="start">黄 = 作業中の branch</text>
  <rect x="400" y="320" width="22" height="22" rx="4" fill="#64b5f6" stroke="#1565c0" stroke-width="2.5"/>
  <text x="430" y="337" font-size="15" font-weight="normal" fill="#212121" text-anchor="start">青 = merge 先などの未来の branch</text>
  <rect x="700" y="320" width="22" height="22" rx="4" fill="#ffffff" stroke="#607d8b" stroke-width="2.5"/>
  <text x="730" y="337" font-size="15" font-weight="normal" fill="#212121" text-anchor="start">白 = それ以外</text>
  <rect x="170" y="352" width="22" height="22" rx="4" fill="#ffffff" stroke="#2e7d32" stroke-width="2.5"/>
  <text x="200" y="369" font-size="15" font-weight="normal" fill="#212121" text-anchor="start">緑の枠 = Local(手元のPC)</text>
  <rect x="400" y="352" width="22" height="22" rx="4" fill="#ffffff" stroke="#6a1b9a" stroke-width="2.5"/>
  <text x="430" y="369" font-size="15" font-weight="normal" fill="#212121" text-anchor="start">紫の枠 = Remote(GitHub)</text>
</svg>
