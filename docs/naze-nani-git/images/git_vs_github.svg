<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380" font-family="'Meiryo','Hiragino Sans','Noto Sans JP',sans-serif">
  <defs>
    <marker id="m" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto"><path d="M0,1 L14,7 L0,13 z" fill="#37474f"/></marker>
    <marker id="g" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto"><path d="M0,1 L14,7 L0,13 z" fill="#90a4ae"/></marker>
  </defs>
  <rect width="900" height="380" fill="#ffffff"/>
  <text x="450" y="34" font-size="22" font-weight="bold" fill="#0d47a1" text-anchor="middle">Git と GitHub の違い</text>
  <rect x="20" y="56" width="400" height="220" rx="14" fill="#ffffff" stroke="#2e7d32" stroke-width="4"/>
  <text x="38" y="84" font-size="17" font-weight="bold" fill="#1b5e20" text-anchor="start">Local(手元のPC)</text>
  <rect x="480" y="56" width="400" height="220" rx="14" fill="#ffffff" stroke="#6a1b9a" stroke-width="4"/>
  <text x="498" y="84" font-size="17" font-weight="bold" fill="#4a148c" text-anchor="start">Remote(GitHub など)</text>
  <rect x="44" y="100" width="352" height="80" rx="12" fill="#ffd54f" stroke="#f9a825" stroke-width="3"/>
  <text x="220" y="132" font-size="24" font-weight="bold" fill="#212121" text-anchor="middle">Git</text>
  <text x="220" y="162" font-size="15" font-weight="normal" fill="#212121" text-anchor="middle">履歴を記録・管理する「道具」</text>
  <text x="44" y="212" font-size="15" font-weight="bold" fill="#37474f" text-anchor="start">自分の PC の中で動く</text>
  <text x="44" y="238" font-size="15" font-weight="normal" fill="#37474f" text-anchor="start">ネットがなくても使える</text>
  <rect x="504" y="100" width="352" height="80" rx="12" fill="#ffffff" stroke="#607d8b" stroke-width="3"/>
  <text x="680" y="132" font-size="24" font-weight="bold" fill="#212121" text-anchor="middle">GitHub</text>
  <text x="680" y="162" font-size="15" font-weight="normal" fill="#212121" text-anchor="middle">履歴を置いて共有する「サービス」</text>
  <text x="504" y="212" font-size="15" font-weight="bold" fill="#37474f" text-anchor="start">ネット上で、みんなと共有できる</text>
  <text x="504" y="238" font-size="15" font-weight="normal" fill="#37474f" text-anchor="start">Pull Request で確認してもらえる</text>
  <line x1="424" y1="140" x2="476" y2="140" stroke="#37474f" stroke-width="3" marker-end="url(#m)"/>
  <line x1="476" y1="190" x2="424" y2="190" stroke="#37474f" stroke-width="3" marker-end="url(#m)"/>
  <text x="450" y="130" font-size="13" font-weight="bold" fill="#37474f" text-anchor="middle">push</text>
  <text x="450" y="214" font-size="13" font-weight="bold" fill="#37474f" text-anchor="middle">pull</text>
  <rect x="10" y="298" width="880" height="78" rx="10" fill="#fafafa" stroke="#b0bec5" stroke-width="1.5"/>
  <text x="24" y="327" font-size="16" font-weight="bold" fill="#37474f" text-anchor="start">図の色の見方</text>
  <rect x="170" y="310" width="22" height="22" rx="4" fill="#ffd54f" stroke="#f9a825" stroke-width="2.5"/>
  <text x="200" y="327" font-size="15" font-weight="normal" fill="#212121" text-anchor="start">黄 = 作業中の branch</text>
  <rect x="400" y="310" width="22" height="22" rx="4" fill="#64b5f6" stroke="#1565c0" stroke-width="2.5"/>
  <text x="430" y="327" font-size="15" font-weight="normal" fill="#212121" text-anchor="start">青 = merge 先などの未来の branch</text>
  <rect x="700" y="310" width="22" height="22" rx="4" fill="#ffffff" stroke="#607d8b" stroke-width="2.5"/>
  <text x="730" y="327" font-size="15" font-weight="normal" fill="#212121" text-anchor="start">白 = それ以外</text>
  <rect x="170" y="342" width="22" height="22" rx="4" fill="#ffffff" stroke="#2e7d32" stroke-width="2.5"/>
  <text x="200" y="359" font-size="15" font-weight="normal" fill="#212121" text-anchor="start">緑の枠 = Local(手元のPC)</text>
  <rect x="400" y="342" width="22" height="22" rx="4" fill="#ffffff" stroke="#6a1b9a" stroke-width="2.5"/>
  <text x="430" y="359" font-size="15" font-weight="normal" fill="#212121" text-anchor="start">紫の枠 = Remote(GitHub)</text>
</svg>
