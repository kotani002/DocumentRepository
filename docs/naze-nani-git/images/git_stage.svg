<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" font-family="'Meiryo','Hiragino Sans','Noto Sans JP',sans-serif">
  <defs>
    <marker id="m" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto"><path d="M0,1 L14,7 L0,13 z" fill="#37474f"/></marker>
    <marker id="g" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto"><path d="M0,1 L14,7 L0,13 z" fill="#90a4ae"/></marker>
  </defs>
  <rect width="900" height="400" fill="#ffffff"/>
  <text x="450" y="34" font-size="22" font-weight="bold" fill="#0d47a1" text-anchor="middle">stage:commit に含める変更を選ぶ</text>
  <rect x="20" y="56" width="860" height="240" rx="14" fill="#ffffff" stroke="#2e7d32" stroke-width="4"/>
  <text x="38" y="84" font-size="17" font-weight="bold" fill="#1b5e20" text-anchor="start">Local(手元のPC)</text>
  <text x="40" y="118" font-size="1" font-weight="normal" fill="#212121" text-anchor="start"></text>
  <rect x="40" y="100" width="200" height="180" rx="10" fill="#ffffff" stroke="#607d8b" stroke-width="2"/>
  <text x="140" y="126" font-size="16" font-weight="bold" fill="#212121" text-anchor="middle">working directory</text>
  <text x="140" y="148" font-size="12" font-weight="normal" fill="#455a64" text-anchor="middle">編集中のフォルダ</text>
  <rect x="350" y="100" width="200" height="180" rx="10" fill="#ffffff" stroke="#607d8b" stroke-width="2"/>
  <text x="450" y="126" font-size="16" font-weight="bold" fill="#212121" text-anchor="middle">stage</text>
  <text x="450" y="148" font-size="12" font-weight="normal" fill="#455a64" text-anchor="middle">次の commit に入れる変更</text>
  <rect x="660" y="100" width="200" height="180" rx="10" fill="#ffffff" stroke="#607d8b" stroke-width="2"/>
  <text x="760" y="126" font-size="16" font-weight="bold" fill="#212121" text-anchor="middle">local repository</text>
  <text x="760" y="148" font-size="12" font-weight="normal" fill="#455a64" text-anchor="middle">commit の履歴</text>
  <rect x="60" y="162" width="160" height="40" rx="6" fill="#ffd54f" stroke="#f9a825" stroke-width="2"/>
  <text x="140" y="188" font-size="15" font-weight="bold" fill="#212121" text-anchor="middle" font-family="Consolas,'Courier New',monospace">a.txt(変更)</text>
  <rect x="60" y="216" width="160" height="40" rx="6" fill="#ffd54f" stroke="#f9a825" stroke-width="2"/>
  <text x="140" y="242" font-size="15" font-weight="bold" fill="#212121" text-anchor="middle" font-family="Consolas,'Courier New',monospace">b.txt(変更)</text>
  <rect x="370" y="162" width="160" height="40" rx="6" fill="#ffd54f" stroke="#f9a825" stroke-width="2"/>
  <text x="450" y="188" font-size="15" font-weight="bold" fill="#212121" text-anchor="middle" font-family="Consolas,'Courier New',monospace">a.txt</text>
  <text x="450" y="242" font-size="14" font-weight="bold" fill="#78909c" text-anchor="middle">b.txt は入れない</text>
  <circle cx="760" cy="210" r="26" fill="#ffd54f" stroke="#f9a825" stroke-width="3"/>
  <text x="760" y="217" font-size="20" font-weight="bold" fill="#212121" text-anchor="middle">C</text>
  <text x="760" y="258" font-size="14" font-weight="bold" fill="#37474f" text-anchor="middle">a.txt だけ記録</text>
  <line x1="244" y1="182" x2="346" y2="182" stroke="#37474f" stroke-width="3" marker-end="url(#m)"/>
  <line x1="554" y1="182" x2="656" y2="182" stroke="#37474f" stroke-width="3" marker-end="url(#m)"/>
  <text x="295" y="170" font-size="12" font-weight="bold" fill="#0d47a1" text-anchor="middle" font-family="Consolas,'Courier New',monospace">add(a.txt)</text>
  <text x="605" y="170" font-size="12" font-weight="bold" fill="#0d47a1" text-anchor="middle" font-family="Consolas,'Courier New',monospace">commit</text>
  <rect x="10" y="318" width="880" height="78" rx="10" fill="#fafafa" stroke="#b0bec5" stroke-width="1.5"/>
  <text x="24" y="347" font-size="16" font-weight="bold" fill="#37474f" text-anchor="start">図の色の見方</text>
  <rect x="170" y="330" width="22" height="22" rx="4" fill="#ffd54f" stroke="#f9a825" stroke-width="2.5"/>
  <text x="200" y="347" font-size="15" font-weight="normal" fill="#212121" text-anchor="start">黄 = 作業中の branch</text>
  <rect x="400" y="330" width="22" height="22" rx="4" fill="#64b5f6" stroke="#1565c0" stroke-width="2.5"/>
  <text x="430" y="347" font-size="15" font-weight="normal" fill="#212121" text-anchor="start">青 = merge 先などの未来の branch</text>
  <rect x="700" y="330" width="22" height="22" rx="4" fill="#ffffff" stroke="#607d8b" stroke-width="2.5"/>
  <text x="730" y="347" font-size="15" font-weight="normal" fill="#212121" text-anchor="start">白 = それ以外</text>
  <rect x="170" y="362" width="22" height="22" rx="4" fill="#ffffff" stroke="#2e7d32" stroke-width="2.5"/>
  <text x="200" y="379" font-size="15" font-weight="normal" fill="#212121" text-anchor="start">緑の枠 = Local(手元のPC)</text>
  <rect x="400" y="362" width="22" height="22" rx="4" fill="#ffffff" stroke="#6a1b9a" stroke-width="2.5"/>
  <text x="430" y="379" font-size="15" font-weight="normal" fill="#212121" text-anchor="start">紫の枠 = Remote(GitHub)</text>
</svg>
