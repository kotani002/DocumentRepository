<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 490" width="900" height="490" font-family="'Meiryo','Hiragino Sans','Noto Sans JP',sans-serif">
  <defs>
    <marker id="m" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto"><path d="M0,1 L14,7 L0,13 z" fill="#37474f"/></marker>
    <marker id="g" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto"><path d="M0,1 L14,7 L0,13 z" fill="#90a4ae"/></marker>
  </defs>
  <rect width="900" height="490" fill="#ffffff"/>
  <text x="450" y="34" font-size="22" font-weight="bold" fill="#0d47a1" text-anchor="middle">branch の具体例:ログイン画面を作る</text>
  <rect x="20" y="56" width="860" height="330" rx="14" fill="#ffffff" stroke="#2e7d32" stroke-width="4"/>
  <text x="38" y="84" font-size="17" font-weight="bold" fill="#1b5e20" text-anchor="start">Local(手元のPC)</text>
  <text x="40" y="124" font-size="1" font-weight="normal" fill="#212121" text-anchor="start"></text>
  <text x="44" y="150" font-size="16" font-weight="bold" fill="#0d47a1" text-anchor="start">main</text>
  <line x1="165" y1="146" x2="194" y2="146" stroke="#37474f" stroke-width="3" marker-end="url(#m)"/>
  <circle cx="140" cy="146" r="24" fill="#64b5f6" stroke="#1565c0" stroke-width="3"/>
  <text x="140" y="153" font-size="20" font-weight="bold" fill="#212121" text-anchor="middle">A</text>
  <circle cx="225" cy="146" r="24" fill="#64b5f6" stroke="#1565c0" stroke-width="3"/>
  <text x="225" y="153" font-size="20" font-weight="bold" fill="#212121" text-anchor="middle">B</text>
  <text x="300" y="152" font-size="14" font-weight="bold" fill="#0d47a1" text-anchor="start">← 動いている状態を保つ(ログイン画面は、まだ無い)</text>
  <text x="44" y="254" font-size="16" font-weight="bold" fill="#8a5a00" text-anchor="start">feature/login</text>
  <line x1="225" y1="170" x2="300" y2="224" stroke="#37474f" stroke-width="3" marker-end="url(#m)"/>
  <line x1="325" y1="250" x2="354" y2="250" stroke="#37474f" stroke-width="3" marker-end="url(#m)"/>
  <circle cx="325" cy="250" r="24" fill="#ffd54f" stroke="#f9a825" stroke-width="3"/>
  <text x="325" y="257" font-size="20" font-weight="bold" fill="#212121" text-anchor="middle">C</text>
  <circle cx="410" cy="250" r="24" fill="#ffd54f" stroke="#f9a825" stroke-width="3"/>
  <text x="410" y="257" font-size="20" font-weight="bold" fill="#212121" text-anchor="middle">D</text>
  <line x1="350" y1="250" x2="379" y2="250" stroke="#37474f" stroke-width="3" marker-end="url(#m)"/>
  <text x="450" y="256" font-size="14" font-weight="bold" fill="#8a5a00" text-anchor="start">← ここで、ログイン画面を作っていく</text>
  <text x="300" y="220" font-size="1" font-weight="normal" fill="#212121" text-anchor="start"></text>
  <rect x="60" y="290" width="360" height="80" rx="8" fill="#ffffff" stroke="#607d8b" stroke-width="2"/>
  <text x="72" y="312" font-size="13" font-weight="bold" fill="#455a64" text-anchor="start">main に切り替えたときのフォルダ</text>
  <rect x="72" y="324" width="90" height="34" rx="6" fill="#ffffff" stroke="#607d8b" stroke-width="2"/>
  <text x="117" y="346" font-size="13" font-weight="bold" fill="#212121" text-anchor="middle" font-family="Consolas,'Courier New',monospace">index.html</text>
  <rect x="460" y="290" width="400" height="80" rx="8" fill="#ffffff" stroke="#607d8b" stroke-width="2"/>
  <text x="472" y="312" font-size="13" font-weight="bold" fill="#455a64" text-anchor="start">feature/login に切り替えたときのフォルダ</text>
  <rect x="472" y="324" width="90" height="34" rx="6" fill="#ffffff" stroke="#607d8b" stroke-width="2"/>
  <text x="517" y="346" font-size="13" font-weight="bold" fill="#212121" text-anchor="middle" font-family="Consolas,'Courier New',monospace">index.html</text>
  <rect x="574" y="324" width="100" height="34" rx="6" fill="#ffd54f" stroke="#f9a825" stroke-width="2"/>
  <text x="624" y="346" font-size="13" font-weight="bold" fill="#212121" text-anchor="middle" font-family="Consolas,'Courier New',monospace">login.html</text>
  <text x="440" y="348" font-size="22" font-weight="bold" fill="#37474f" text-anchor="middle">⇄</text>
  <rect x="10" y="402" width="880" height="78" rx="10" fill="#fafafa" stroke="#b0bec5" stroke-width="1.5"/>
  <text x="24" y="431" font-size="16" font-weight="bold" fill="#37474f" text-anchor="start">図の色の見方</text>
  <rect x="170" y="414" width="22" height="22" rx="4" fill="#ffd54f" stroke="#f9a825" stroke-width="2.5"/>
  <text x="200" y="431" font-size="15" font-weight="normal" fill="#212121" text-anchor="start">黄 = 作業中の branch</text>
  <rect x="400" y="414" width="22" height="22" rx="4" fill="#64b5f6" stroke="#1565c0" stroke-width="2.5"/>
  <text x="430" y="431" font-size="15" font-weight="normal" fill="#212121" text-anchor="start">青 = merge 先などの未来の branch</text>
  <rect x="700" y="414" width="22" height="22" rx="4" fill="#ffffff" stroke="#607d8b" stroke-width="2.5"/>
  <text x="730" y="431" font-size="15" font-weight="normal" fill="#212121" text-anchor="start">白 = それ以外</text>
  <rect x="170" y="446" width="22" height="22" rx="4" fill="#ffffff" stroke="#2e7d32" stroke-width="2.5"/>
  <text x="200" y="463" font-size="15" font-weight="normal" fill="#212121" text-anchor="start">緑の枠 = Local(手元のPC)</text>
  <rect x="400" y="446" width="22" height="22" rx="4" fill="#ffffff" stroke="#6a1b9a" stroke-width="2.5"/>
  <text x="430" y="463" font-size="15" font-weight="normal" fill="#212121" text-anchor="start">紫の枠 = Remote(GitHub)</text>
</svg>
